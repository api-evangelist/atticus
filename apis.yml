aid: atticus
name: Atticus
description: 'Atticus is a consumer legal-technology law firm, launched in 2019 and backed by Forerunner
  Ventures, True Ventures, and GV, that helps Americans in crisis get the benefits and aid they deserve.
  It began with Social Security Disability and has expanded to workers'' compensation, VA benefits, and
  other government-aid programs. Atticus combines a free online qualification quiz, on-staff lawyers and
  client advocates reachable by phone, text, or chat, and a matching engine that connects each client
  with vetted attorneys from a network of 100+ top firms who work on contingency. It has helped tens of
  thousands of people access billions of dollars in life-changing aid. Atticus is a consumer-facing
  service company and does not publish a public developer API, SDKs, or developer portal.'
